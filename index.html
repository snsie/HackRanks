<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>IC3 Judging Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a reading-room desk. Sticky top bar with view tabs; each view is a single column of
   panels, with the team sheet split into evidence (left) and scoring (right) on wide screens. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --surface-2: #f6f8f9;
  --ink: #13202a;
  --muted: #566775;
  --line: #d6dee4;
  --accent: #0a7a73;
  --accent-ink: #ffffff;
  --accent-soft: #dff1ef;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --danger: #b42318;
  --danger-soft: #fde4e1;
  --good: #2c7a4b;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1419; --surface: #141e25; --surface-2: #19252d; --ink: #e4ecf1; --muted: #93a5b2;
    --line: #273641; --accent: #39c0b5; --accent-ink: #062320; --accent-soft: #123532;
    --warn: #e6a640; --warn-soft: #3a2a10; --danger: #f2786c; --danger-soft: #3d1a17; --good: #5fc48d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1419; --surface: #141e25; --surface-2: #19252d; --ink: #e4ecf1; --muted: #93a5b2;
  --line: #273641; --accent: #39c0b5; --accent-ink: #062320; --accent-soft: #123532;
  --warn: #e6a640; --warn-soft: #3a2a10; --danger: #f2786c; --danger-soft: #3d1a17; --good: #5fc48d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 600; }
h4 { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: .01em; }
.brand .sub { font-size: .85rem; color: var(--muted); }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.judge-in { width: 150px; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); padding: 5px 11px; border-radius: var(--radius); cursor: pointer; font-size: .85rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.save-state { font-size: .78rem; color: var(--muted); white-space: nowrap; }
a.dl { color: var(--accent); font-family: var(--font-data); font-size: .78rem; font-weight: 500; text-decoration: none; white-space: nowrap; text-transform: none; letter-spacing: 0; }
a.dl:hover { text-decoration: underline; }
a.btn { text-decoration: none; color: inherit; display: inline-block; }
.save-state[data-kind="ok"]::before { content: "● "; color: var(--good); }
.save-state[data-kind="local"]::before { content: "● "; color: var(--warn); }
.save-state[data-kind="busy"]::before { content: "● "; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 8px 14px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; font-size: .92rem; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }

main { padding-block: 22px 60px; }
.view { display: grid; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.panel > h3 + * { margin-top: 10px; }
.stack { display: grid; gap: 12px; }
.lede { max-width: 72ch; color: var(--muted); }

/* stat strip */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; }
.stat .v { font-family: var(--font-data); font-size: 1.45rem; font-weight: 500; }
.stat .k { font-size: .8rem; color: var(--muted); }

.callout { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 12px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
.callout.info { border-left-color: var(--accent); background: var(--accent-soft); }
.callout ul { margin: 6px 0 0; padding-left: 18px; }
.callout li + li { margin-top: 4px; }

/* tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
thead th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
th.sortable button { border: 0; padding: 0; background: transparent; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
th.sortable button:hover { color: var(--ink); }
th .arrow { font-size: .7rem; }
td.r, th.r { text-align: right; }
td.c, th.c { text-align: center; }
tbody tr:hover { background: var(--surface-2); }
.team-link { color: var(--ink); font-weight: 600; text-decoration: none; }
.team-link:hover { color: var(--accent); text-decoration: underline; }
.cell { display: inline-grid; place-items: center; min-width: 28px; height: 26px; border-radius: 4px; font-family: var(--font-data); font-size: .85rem; }
.cell.s1 { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.cell.s2 { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
.cell.s3 { background: color-mix(in srgb, var(--accent) 36%, var(--surface)); }
.cell.s4 { background: color-mix(in srgb, var(--accent) 58%, var(--surface)); }
.cell.s5 { background: var(--accent); color: var(--accent-ink); }
.cell.sugg { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-style: italic; }
.cell.empty { color: var(--muted); }
.bar-mini { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; }
.pill { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.pill.danger { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
.pill.good { border-color: var(--good); color: var(--good); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); align-items: center; }

/* team view */
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.picker select { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0; max-width: 100%; }
.team-head { display: grid; gap: 6px; }
.team-head .file { font-family: var(--font-data); font-size: .78rem; color: var(--muted); word-break: break-all; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--surface-2); }
.tile .v { font-family: var(--font-data); font-size: 1.2rem; }
.tile .k { font-size: .75rem; color: var(--muted); }
.split { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .split { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; } .split > .sheet { position: sticky; top: 112px; max-height: calc(100vh - 128px); overflow-y: auto; } }
.two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
ul.tight { margin: 6px 0 0; padding-left: 18px; }
ul.tight li + li { margin-top: 5px; }
.flag { display: flex; gap: 8px; padding: 9px 11px; border-radius: var(--radius); font-size: .9rem; }
.flag.warn { background: var(--warn-soft); }
.flag.danger { background: var(--danger-soft); }
.flag.info { background: var(--accent-soft); }
.flag b { white-space: nowrap; }

/* scoring sheet */
.sheet { display: grid; gap: 12px; }
.crit { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; background: var(--surface); }
.crit-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px; }
.crit-top .w { font-family: var(--font-data); font-size: .8rem; color: var(--muted); }
.sugg-box { font-size: .85rem; color: var(--muted); background: var(--surface-2); border-radius: 4px; padding: 7px 9px; }
.sugg-box b { color: var(--ink); font-family: var(--font-data); }
.scores { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.scores button { width: 38px; height: 34px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-family: var(--font-data); font-size: .95rem; }
.scores button:hover { border-color: var(--accent); }
.scores button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.scores .pts { margin-left: auto; font-family: var(--font-data); font-size: .85rem; color: var(--muted); }
.scores .clear { width: auto; padding: 0 8px; font-family: var(--font-body); font-size: .78rem; color: var(--muted); }
textarea { width: 100%; min-height: 54px; resize: vertical; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 7px 9px; font-size: .88rem; }
details.desc summary { cursor: pointer; font-size: .8rem; color: var(--accent); }
details.desc ul { margin: 6px 0 0; padding-left: 18px; font-size: .84rem; color: var(--muted); }
.total-bar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; padding: 12px 14px; border-radius: var(--radius); background: var(--accent-soft); }
.total-bar .big { font-family: var(--font-data); font-size: 1.6rem; font-weight: 500; }
.coi { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.coi input { accent-color: var(--danger); width: 16px; height: 16px; }

/* compare */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: .82rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cmp th[scope="row"] { font-size: .78rem; color: var(--muted); font-weight: 600; text-transform: none; letter-spacing: 0; width: 170px; min-width: 140px; position: sticky; left: 0; background: var(--surface); }
.cmp td { vertical-align: top; min-width: 220px; }
.cmp td ul { margin: 0; padding-left: 16px; }
.cmp tr.sec th { font-family: var(--font-display); font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--surface-2); padding-top: 10px; }
.best { font-weight: 600; color: var(--accent); }

/* field */
.chart-box { overflow-x: auto; }
.chart-box svg { display: block; min-width: 560px; width: 100%; height: auto; }
.chart-box text { fill: var(--ink); font-family: var(--font-body); font-size: 12px; }
.chart-box .tick { fill: var(--muted); font-family: var(--font-data); font-size: 11px; }
.chart-box .grid { stroke: var(--line); stroke-width: 1; }
.chart-box .barr { fill: var(--accent); }
.chart-box .barr.ens { fill: var(--warn); }
.chart-box .val { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
.mx td.c { font-size: 1rem; }
.yes { color: var(--accent); font-weight: 700; }
.no { color: var(--line); }
.insights { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.insight { border-top: 2px solid var(--accent); padding-top: 10px; }
.insight p { font-size: .9rem; color: var(--muted); margin-top: 4px; }

/* rubric */
.rub td { vertical-align: top; }
.rub td:first-child { white-space: nowrap; font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--radius); font-size: .85rem; z-index: 20; max-width: calc(100% - 32px); }
.copy-area { width: 100%; min-height: 160px; font-family: var(--font-data); font-size: .75rem; }
@media (max-width: 640px) {
  .judge-in { width: 120px; }
  .tools { margin-left: 0; }
  .split > .sheet { position: static; max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="bar-top">
      <div class="brand">
        <h1>IC3 Judging Desk</h1>
        <span class="sub">Hackathon 2026 · Track A · 21 submissions · scored to the six-criterion rubric</span>
      </div>
      <div class="tools">
        <input id="judge-name" class="judge-in" placeholder="Your name (judge)" aria-label="Judge name">
        <label class="toggle" title="Hide the draft scores to score blind first"><input type="checkbox" id="show-sugg" checked> Draft scores</label>
        <button class="btn primary" id="export-btn" type="button">Export my scores</button>
        <span class="save-state" id="save-state" data-kind="busy">Loading…</span>
      </div>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#test-results" data-view="test-results">Test results</a>
      <a href="#teams" data-view="teams">Team sheets</a>
      <a href="#compare" data-view="compare">Compare</a>
      <a href="#field" data-view="field">Field analysis</a>
      <a href="#rubric" data-view="rubric">Rubric</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-test-results" hidden></section>
  <section class="view" id="view-teams" hidden></section>
  <section class="view" id="view-compare" hidden></section>
  <section class="view" id="view-field" hidden></section>
  <section class="view" id="view-rubric" hidden></section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------------- Rubric ---------------- */
const CRIT = [
  { k: "c1", name: "Clinical relevance and impact", short: "Clinical", w: 25,
    look: "A clearly defined clinical or health problem; a credible case for benefit to patients, clinicians, or care delivery",
    d5: "Addresses an important, well-documented clinical need; impact on outcomes, safety, or efficiency is clearly argued and plausible.",
    d3: "The clinical problem is relevant, but the benefit or intended users are only loosely defined.",
    d1: "No clear clinical problem, or the link between the solution and care is not explained." },
  { k: "c2", name: "Technical approach and quality", short: "Technical", w: 25,
    look: "Sound methods and appropriate data; working model or prototype; results evaluated with suitable metrics",
    d5: "Methods are well chosen and justified; the prototype works; evaluation is rigorous and results are reported honestly.",
    d3: "Reasonable approach with a partially working prototype; evaluation is limited or metrics are incomplete.",
    d1: "Approach is unclear or inappropriate; no working output or evaluation." },
  { k: "c3", name: "Innovation and creativity", short: "Innovation", w: 15,
    look: "A novel idea, method, or application; goes beyond a routine or off-the-shelf solution",
    d5: "A fresh idea or a creative combination of methods that offers a new way to approach the problem.",
    d3: "Some original elements, but largely builds on familiar approaches.",
    d1: "Replicates an existing solution with no meaningful new contribution." },
  { k: "c4", name: "Responsible and trustworthy AI", short: "Responsible AI", w: 15,
    look: "Attention to bias and fairness, data privacy, safety, transparency, and limitations",
    d5: "Identifies and addresses risks such as bias, privacy, and safety; explains limitations and how outputs would be overseen by people.",
    d3: "Acknowledges key risks but offers limited mitigation.",
    d1: "Ethical, privacy, or safety considerations are not addressed." },
  { k: "c5", name: "Feasibility and path to adoption", short: "Feasibility", w: 10,
    look: "Realistic next steps, workflow fit, and the resources needed to move toward real-world use",
    d5: "Clear, realistic plan for next steps, integration into clinical workflow, and needed data, partners, or validation.",
    d3: "Next steps are named but lack detail or underestimate barriers.",
    d1: "No discussion of how the work could be developed or used." },
  { k: "c6", name: "Communication and presentation", short: "Communication", w: 10,
    look: "Clear, well-organized submission and demo; the team can explain its choices and results",
    d5: "Compelling, well-organized, and easy to follow for both clinical and technical audiences; questions answered with confidence.",
    d3: "Understandable, but key points are buried or the demo is hard to follow.",
    d1: "Disorganized or incomplete; the project's purpose is unclear." }
];
const SCALE = { 5: "Exceptional", 4: "Strong", 3: "Adequate", 2: "Limited", 1: "Insufficient" };

/* ---------------- Submissions (from the 21 decks) ----------------
   ba/auc/f1: validation-set numbers the team reports from the official evaluate.py.
   errApprox: error count derived from balanced accuracy (2,400 balanced images) where the deck gives none.
   sugg: draft 1-5 scores with a one-line reason each. */
const TEAMS = [
{ id: "zarn-vision", name: "ZARN Vision", file: "summary_ZARN_Vision.pptx", slides: 10,
  title: "BiomedCLIP CT Organ Classification with Stable Fine-Tuning Strategy",
  members: ["Zijian Xu", "Anabel Chang", "Renjie Liang", "Dr. Naveen Baskaran"],
  ba: 0.9938, baNote: "official split with the ensemble; 99.33% from an official evaluate.py run; 99.15% mean over 5 folds", auc: 0.9999, f1: null, err: 20, errNote: "per 2,400 (fold average)", views: null,
  approach: "LoRA warm-up, then full image-encoder fine-tuning; weights averaged over epochs 2–5; 10-member ensemble (5 × 224 px + 5 × 336 px) plus a label-free training-image cache.",
  tech: { text: false, peft: true, soup: "Epoch averaging + 10-member ensemble", tta: false, cv: true, seeds: true, robust: false, errs: true, limits: true, clinical: true },
  summary: "Starts from a teammate's single fine-tuned model (99.12% on one lucky seed) and shows it is unstable: across 5 folds × 5 seeds the same recipe ranges 97.1–99.2%. Builds a stable system with weight averaging, a two-resolution ensemble and a nearest-neighbour image cache, reaching 99.15% mean across 5 folds with fold spread cut from 2.1 to 0.6 points. The only deck with a dedicated clinical-relevance slide.",
  method: ["Step 1: LoRA warm-up (41.2% → 98.1%); step 2: full fine-tuning (→ 99.1%, one run)", "Step 3: average weights of epochs 2–5; train 10 members at 224 px and 336 px", "Label-free cache pulls each image toward its 2 most similar training images (strength 0.3)", "Every choice decided on paired 5-fold × 5-seed comparisons; final members retrained on all 16,800 crops"],
  results: ["5-fold CV mean 97.71% (single model) → 99.15% (final)", "Official split 99.38%, macro AUC 99.99%", "Errors per fold 55 → 20; pancreas ↔ kidney is 47 of 102 remaining errors", "Ablation table of 10 ideas with kept / dropped verdicts"],
  strengths: ["Exposes seed variance others ignored (the 'seed lottery') and evaluates on 25 runs", "Only team to name clinical users and uses: organ tagging, segmentation QC, routing to organ-specific models, report pre-fill", "Names concrete steps toward clinical use: 3-D localization, multi-site validation, calibrated deferral to a radiologist"],
  gaps: ["The inference system is a 10-model output ensemble plus a training-image lookup, which may conflict with the one-model rule", "Final members retrained on all 16,800 crops, which includes the 2,400 validation images", "Clinical slide was added at a mentor's request; it lists uses but cites no evidence or workflow data"],

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
(function loadLocal() {
  const raw = lsGet(LS_KEY);
  if (raw) { try { const o = JSON.parse(raw); if (o && o.teams) S.sheet = o; } catch (e) {} }
  const ui = lsGet(LS_KEY + "-ui");
  if (ui) { try { const o = JSON.parse(ui); if (typeof o.showSugg === "boolean") S.showSugg = o.showSugg; if (Array.isArray(o.compare)) S.compare = o.compare.filter(id => byId[id]).slice(0, 4); if (byId[o.current]) S.current = o.current; } catch (e) {} }
})();
function saveUi() { lsSet(LS_KEY + "-ui", JSON.stringify({ showSugg: S.showSugg, compare: S.compare, current: S.current })); }
function setSaveState(kind, text) { const el = $("#save-state"); el.dataset.kind = kind; el.textContent = text; }

let writeTimer = null, writing = false, pendingWrite = false;
function persist() {
  S.sheet.updatedAt = Date.now();
  lsSet(LS_KEY, JSON.stringify(S.sheet));
  if (!S.store) { setSaveState("local", "Saved in this browser"); return; }
  setSaveState("busy", "Saving…");
  clearTimeout(writeTimer);
  writeTimer = setTimeout(flushWrite, 700);
}
async function flushWrite() {
  if (!S.store) return;
  if (writing) { pendingWrite = true; return; }
  writing = true;
  try {
    await S.store.ref.set(JSON.parse(JSON.stringify(S.sheet)));
    setSaveState("ok", "Saved to your account");
  } catch (e) {
    if (e && e.code === "invalid_argument") { S.store = null; setSaveState("local", "Saved in this browser"); }
    else setSaveState("local", "Saved in this browser · sync failed");
  } finally {
    writing = false;
    if (pendingWrite) { pendingWrite = false; flushWrite(); }
  }
}
async function connectStore() {
  try {
    if (!window.claude || !window.claude.use) { setSaveState("local", "Saved in this browser"); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { setSaveState("local", "Saved in this browser"); return; }
    const ref = db.doc("data/users/" + uid + "/sheet");
    let settled = false;
    const timer = setTimeout(() => { if (!settled) setSaveState("local", "Saved in this browser · account not reachable yet"); }, 10000);
    ref.onSnapshot(snap => {
      if (snap.metadata.fromCache || snap.metadata.hasPendingWrites) return;
      const first = !settled;
      if (first) { settled = true; clearTimeout(timer); S.store = { ref }; }
      const remote = snap.exists ? snap.data() : null;
      const rT = (remote && remote.updatedAt) || 0, lT = S.sheet.updatedAt || 0;
      if (remote && remote.teams && rT > lT) {
        // Newer scores from another device or tab: adopt them.
        S.sheet = JSON.parse(JSON.stringify(remote));
        lsSet(LS_KEY, JSON.stringify(S.sheet));
        $("#judge-name").value = S.sheet.judge || "";
        renderAll();
        setSaveState("ok", "Saved to your account");
      } else if (first && lT > rT) {
        // Scores entered in this browser before the account answered: upload once.
        setTimeout(flushWrite, 0);
      } else if (first || rT === lT) {
        setSaveState("ok", "Saved to your account");
      }
    }, () => { clearTimeout(timer); S.store = null; setSaveState("local", "Saved in this browser"); });
  } catch (e) { setSaveState("local", "Saved in this browser"); }
}

        ${TECH_ROWS.map(([k, label]) => row(label, t => { const v = t.tech[k]; return v ? `<span class="yes">✓</span>${typeof v === "string" ? " " + esc(v) : ""}` : `<span class="muted">—</span>`; })).join("")}
        ${sec("Scores")}
        ${CRIT.map(c => row(`${c.short} (${c.w})`, t => { const m = myScore(t.id, c.k); const s = t.sugg[c.k]; return `${m ? `<span class="cell s${m}">${m}</span> ` : ""}${S.showSugg ? `<span class="muted" style="font-size:.82rem">Draft ${s[0]}: ${esc(s[1])}</span>` : (m ? "" : `<span class="muted">Not scored</span>`)}`; })).join("")}
        ${row("Total /100", t => { const m = myTotal(t.id); return `<b class="num">${m != null ? fmt1(m) : "—"}</b>${S.showSugg ? ` <span class="muted num">(draft ${fmt1(suggTotal(t))})</span>` : ""}`; })}
        ${sec("Assessment")}
        ${row("Strengths", t => `<ul>${t.strengths.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`)}
        ${row("Gaps", t => `<ul>${t.gaps.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`)}
        ${row("Checks", t => t.flags.length ? t.flags.map(f => `<div class="flag ${f.lvl}" style="font-size:.82rem;margin-bottom:4px">${esc(f.t)}</div>`).join("") : `<span class="muted">None</span>`)}
      </tbody></table></div></div>` : `<div class="panel muted">Pick at least one team above to compare.</div>`}`;
  el.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.id;
    if (S.compare.includes(id)) S.compare = S.compare.filter(x => x !== id);
    else { if (S.compare.length >= 4) { toast("Compare holds four teams. Remove one first."); return; } S.compare.push(id); }
    saveUi(); renderCompare();
  }));
}

/* ---------------- Rendering: field analysis ---------------- */
function chartSvg() {
  const data = TEAMS.filter(t => t.ba != null).sort((a, b) => b.ba - a.ba);
  const W = 860, rowH = 24, top = 30, left = 200, right = 70, H = top + data.length * rowH + 30;
  const lo = 0.980, hi = 1.0;
  const x = v => left + (v - lo) / (hi - lo) * (W - left - right);
  const ticks = [0.980, 0.985, 0.990, 0.995, 1.0];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Validation balanced accuracy by team, axis from 98.0% to 100%">`;
  ticks.forEach(tk => { s += `<line class="grid" x1="${x(tk)}" x2="${x(tk)}" y1="${top - 6}" y2="${H - 24}"/><text class="tick" x="${x(tk)}" y="${H - 8}" text-anchor="middle">${(tk * 100).toFixed(1)}%</text>`; });
  s += `<text class="tick" x="${left}" y="14">Axis starts at 98.0%: bar lengths exaggerate differences</text>`;
  data.forEach((t, i) => {
    const y = top + i * rowH;
    const ens = t.id === "zarn-vision";
    s += `<text x="${left - 8}" y="${y + 15}" text-anchor="end">${esc(t.name.replace(/ \(.*\)/, ""))}</text>`;
    s += `<rect class="barr${ens ? " ens" : ""}" x="${left}" y="${y + 4}" width="${Math.max(2, x(t.ba) - left)}" height="${rowH - 9}" rx="2"/>`;
    s += `<text class="val" x="${x(t.ba) + 6}" y="${y + 15}">${(t.ba * 100).toFixed(2)}${ens ? " *" : ""}</text>`;
  });
  return s + `</svg>`;
}
function renderField() {
  const el = $("#view-field");
  const count = k => TEAMS.filter(t => t.tech[k]).length;
  el.innerHTML = `
    <div class="panel">
      <h3>Validation accuracy across the field</h3>
      <p class="lede" style="margin-top:6px">Twenty teams report an official validation score; VisionTron reports cross-validation only (97.39%). The spread from first to last is 1.33 points, about 32 images out of 2,400. Several teams note that seed noise alone moves scores by 0.1–0.3 points.</p>
      <div class="chart-box" style="margin-top:12px">${chartSvg()}</div>
      <p class="muted" style="font-size:.8rem">* ZARN Vision's 99.38% comes from a 10-model ensemble with an image cache, retrained on train + val; their 5-fold mean is 99.15%. The ensemble’s test results are shown for reference because the final submission required a single fine-tuned model.</p>
    </div>
    <div class="panel">
      <h3>Technique matrix</h3>
      <p class="muted" style="font-size:.85rem;margin-top:4px">What each deck reports doing. Counts are out of 21.</p>
      <div class="scroll" style="margin-top:10px"><table class="mx">
        <thead><tr><th>Team</th>${TECH_ROWS.map(([k, l]) => `<th class="c" title="${l}">${l}<br><span class="muted num">${count(k)}</span></th>`).join("")}</tr></thead>
        <tbody>${TEAMS.map(t => `<tr><td><a class="team-link" href="#team-${t.id}">${esc(t.name)}</a></td>${TECH_ROWS.map(([k]) => `<td class="c">${t.tech[k] ? `<span class="yes" title="${typeof t.tech[k] === "string" ? esc(t.tech[k]) : "Yes"}">✓</span>` : `<span class="no">·</span>`}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div class="panel">
      <h3>What the field shows</h3>
      <div class="insights" style="margin-top:12px">
        <div class="insight"><h4>Converged recipe</h4><p>Nearly every team trains with cross-entropy over the cosine similarity to all five official prompt templates, keeps the evaluator's scoring rule, and averages weights from several runs. Fine-tuning alone takes 41% to about 98–99%.</p></div>
        <div class="insight"><h4>Saturated validation</h4><p>Teams that built their own held-out folds (Git_Happens, Kong, 3 Little Piggies, Emperors, ZARN) found validation too small to separate recipes. That extra evaluation is the clearest marker of technical quality here.</p></div>
        <div class="insight"><h4>Shared failure modes</h4><p>Almost every team's residual errors are right-lung bases read as liver, sagittal pancreas read as kidney, and contrast-filled bladder. Several show the same crops fail across all models, which points to label ambiguity in the crops.</p></div>
        <div class="insight"><h4>Anatomy-aware choices</h4><p>Most teams avoid horizontal flips because liver and spleen swap sides; TBD_Team_G and Falcons measured the cost on sagittal views. SETU kept flips. TBD_Team_A built side-aware prompts from its error analysis.</p></div>
        <div class="insight"><h4>Shortcut risk</h4><p>3 Little Piggies show pixel statistics alone reach 0.917. Because each crop is the organ's bounding box resized to 224 px, upscaling reveals organ size. This affects how much any team's accuracy reflects anatomy.</p></div>
        <div class="insight"><h4>Rubric coverage gaps</h4><p>Only ${count("clinical")} team frames clinical use; ${count("limits")} state limitations. No team discusses bias across patient groups, data privacy or human oversight beyond ZARN's mention of radiologist deferral.</p></div>
      </div>
    </div>`;
}

/* ---------------- Export ---------------- */
function csvCell(v) { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCsv() {
  const head = ["Judge", "Team", "Project title", "Conflict of interest"];
  CRIT.forEach(c => head.push(`${c.name} score`, `${c.name} points`, `${c.name} comment`));
  head.push("Total /100", "Greatest strength", "Most important area to improve");
  const lines = [head.map(csvCell).join(",")];
  TEAMS.forEach(t => {
    const sh = S.sheet.teams[t.id] || { s: {}, c: {} };
    const r = [S.sheet.judge || "", t.name, t.title, sh.coi ? "Yes - recused" : "None"];
    CRIT.forEach(c => { const v = sh.s?.[c.k]; r.push(v || "", v ? fmt1(pts(v, c.w)) : "", sh.c?.[c.k] || ""); });
    const tot = myTotal(t.id);
    r.push(sh.coi ? "" : (tot != null ? fmt1(tot) : ""), sh.strength || "", sh.improve || "");
    lines.push(r.map(csvCell).join(","));
  });
  return lines.join("\n");
}
async function exportScores() {
  const csv = buildCsv();
  const name = "IC3-scores-" + ((S.sheet.judge || "judge").replace(/[^A-Za-z0-9]+/g, "-")) + ".csv";
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data: csv }); toast("Scores saved as " + name); return; }
  } catch (e) { if (e && e.code === "declined") return; }
  if (!(window.claude && window.claude.use)) {
    // Standalone hosting (e.g. GitHub Pages): a normal browser download works.
    try {
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      const a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("Scores downloaded as " + name); return;
    } catch (e) {}
  }
  try { await navigator.clipboard.writeText(csv); toast("Scores copied to the clipboard as CSV"); }
  catch (e) { showCopyFallback(csv); }
}
function showCopyFallback(csv) {
  const el = $("#view-" + S.view);
  const box = document.createElement("div");
  box.className = "panel";
  box.innerHTML = `<h3>Copy your scores</h3><p class="muted" style="margin:6px 0">Select all and copy this CSV, then paste it into a spreadsheet.</p><textarea class="copy-area" id="csv-out" readonly></textarea>`;
  el.prepend(box);
  const ta = $("#csv-out"); ta.value = csv; ta.focus(); ta.select();
}

/* ---------------- Routing ---------------- */
function refreshBadges() { /* totals shown in overview are recomputed when that view renders */ }
function route() {
  const h = (location.hash || "#overview").slice(1);
  let view = "overview";
  if (h.startsWith("team-") && byId[h.slice(5)]) { view = "teams"; S.current = h.slice(5); saveUi(); }
  else if (["overview", "test-results", "teams", "compare", "field", "rubric"].includes(h)) view = h;
  S.view = view;
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "view-" + view);
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.view === view ? "page" : "false"));
  renderView(view);
}
function renderView(v) { ({ overview: renderOverview, "test-results": renderTestResults, teams: renderTeams, compare: renderCompare, field: renderField, rubric: renderRubric })[v](); }
function renderAll() { renderView(S.view); }

$("#judge-name").value = S.sheet.judge || "";
$("#judge-name").addEventListener("input", e => { S.sheet.judge = e.target.value; persist(); });
$("#show-sugg").checked = S.showSugg;
$("#show-sugg").addEventListener("change", e => { S.showSugg = e.target.checked; if (!S.showSugg && S.sort.key === "sugg") S.sort = { key: "name", dir: 1 }; saveUi(); renderAll(); });
$("#export-btn").addEventListener("click", exportScores);
document.querySelectorAll("nav.tabs a").forEach(a => a.addEventListener("click", e => {
  if (a.dataset.view === "teams") { e.preventDefault(); location.hash = "team-" + S.current; }
}));
window.addEventListener("hashchange", route);
if (!S.showSugg && S.sort.key === "sugg") S.sort = { key: "name", dir: 1 };
setSaveState("local", "Saved in this browser");
route();
connectStore();
</script>
